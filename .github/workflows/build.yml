name: Build
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  dylib:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Compile
        run: |
          set -euo pipefail
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          mkdir -p out
          xcrun --sdk iphoneos clang -arch arm64 -isysroot "$SDK" -miphoneos-version-min=15.0 \
            -fobjc-arc -dynamiclib -framework Foundation -framework UIKit -framework AVFoundation \
            -install_name @rpath/NFBExtras.dylib -o out/NFBExtras.dylib NFBExtras.m
          codesign -f -s - out/NFBExtras.dylib
          file out/NFBExtras.dylib
          shasum -a 256 out/NFBExtras.dylib | tee out/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: NFBExtras
          path: out/
